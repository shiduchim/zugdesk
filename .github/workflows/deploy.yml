name: Publish app to phone link

on:
  push:
    branches: [main, "claude/**"]
    paths: ["app/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Every publish is a new version for the phones: the service worker gets this commit's id.
      - name: Mark the version in the service worker
        run: sed -i "s/const BUILD = '__BUILD__';/const BUILD = '${GITHUB_SHA::8}';/" app/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
