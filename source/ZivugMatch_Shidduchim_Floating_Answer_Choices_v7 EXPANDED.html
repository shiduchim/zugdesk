/* V2 shidduchim list controls: compact keeps the familiar list; expanded reveals actions. */
.view-switch{display:flex;gap:3px;border:1px solid #dae5e5;background:#f3f6f5;border-radius:13px;padding:3px;flex:none}
.view-switch button{border:0;background:transparent;border-radius:10px;min-height:36px;padding:7px 14px;color:#5a7474;font-size:12px;font-weight:800}
.view-switch button.on{color:#245c58;background:#fff;box-shadow:0 1px 5px #1f4b4517}
.answers-preview{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px;align-items:center}
.quick-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:100px;font-size:11px;font-weight:780;border:1px solid transparent;white-space:nowrap}
.quick-tag small{font-weight:560;font-size:10px;opacity:.85}
.quick-tag.yes,.choice-button.yes.active{background:#dcf3e9;color:#126b59;border-color:#a5dccb}
.quick-tag.no,.choice-button.no.active{background:#ffebde;color:#a54422;border-color:#f5c2ad}
.quick-tag.thinking,.choice-button.thinking.active{background:#fff3d4;color:#8a6209;border-color:#e9d39d}
.quick-tag.waiting{background:#f3f5f6;color:#6c7b80;border-color:#e1e6e7}
.quick-tag.checking,.choice-button.checking.active{background:#e9f3fa;color:#315e80;border-color:#bbd8eb}
.quick-tag.dating,.choice-button.dating.active{background:#eae6fd;color:#6554a8;border-color:#c9bdf7}
.quick-tag.ended,.choice-button.ended.active{background:#f0f1f2;color:#6b747c;border-color:#dce0e3}
.match.compact .card-sub{margin-top:7px}
/* Compact: show the two answers IN the status row while answers are pending. */
.match.compact .compact-answers-inline{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:7px;margin-bottom:1px}
.match.compact .compact-answers-inline .quick-tag{font-size:12px;padding:4px 11px}
.match.compact .compact-answers-inline .quick-tag small{font-size:11px;font-weight:660}
.match.compact .compact-ended{color:#6b747c;font-size:12px;font-weight:800;margin-left:3px;white-space:nowrap}

/* V6: Custom inline answer chooser. All options are rounded buttons, not OS selects. */
.match.compact{position:relative;cursor:default;isolation:isolate}
.match.compact.menu-open{z-index:12;border-color:#a1cbbf;box-shadow:0 12px 34px #244b451c}
.match.compact .compact-card-open{position:absolute;inset:0;border:0;border-radius:19px;background:transparent;z-index:1;width:100%;height:100%;cursor:pointer;padding:0}
.match.compact .compact-card-open:focus-visible{outline:3px solid #90b4e2;outline-offset:3px}
.match.compact .compact-answers-inline{position:relative;z-index:2;pointer-events:none}
.match.compact .answer-cell{position:relative;display:inline-flex;pointer-events:auto}
.compact-answer-trigger{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 11px!important;border-radius:999px;cursor:pointer;white-space:nowrap;font:inherit;letter-spacing:0;transition:transform .12s,box-shadow .12s}
.compact-answer-trigger:hover{transform:translateY(-1px);box-shadow:0 3px 10px #152e2914}
.compact-answer-trigger[aria-expanded="true"]{outline:2px solid #37796f;outline-offset:2px}
.answer-choice-popover{position:absolute;top:calc(100% + 12px);left:0;width:276px;padding:13px;background:#fff;border:1px solid #dce8e6;border-radius:18px;box-shadow:0 15px 42px #153c3929;z-index:40;cursor:default;pointer-events:auto;animation:answerAppear .16s ease-out}
.answer-cell.girl .answer-choice-popover{left:auto;right:0}
.answer-choice-popover:before{content:"";position:absolute;top:-7px;left:25px;width:12px;height:12px;background:#fff;border-top:1px solid #dce8e6;border-left:1px solid #dce8e6;transform:rotate(45deg)}
.answer-cell.girl .answer-choice-popover:before{left:auto;right:25px}
.answer-choice-title{font-size:12px;color:#617978;font-weight:780;margin:1px 3px 10px}
.answer-choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.answer-option{display:flex;align-items:center;justify-content:center;gap:4px;min-height:44px;border:1px solid #e1e8e7;border-radius:999px;padding:8px 9px;font-size:12px;font-weight:800;background:#f7f9fa;color:#4e666b;white-space:nowrap;cursor:pointer}
.answer-option.yes{background:#e0f4ec;color:#227f6e;border-color:#a5ddc9}
.answer-option.thinking{background:#fff3d6;color:#99660a;border-color:#f0d494}
.answer-option.no{background:#fff0e6;color:#ad583b;border-color:#f4bba7}
.answer-option.waiting{background:#f2f5f6;color:#587079;border-color:#dae4e7}
.answer-option:hover{filter:brightness(.975);box-shadow:0 1px 6px #31433d20;transform:translateY(-1px)}
.answer-option.chosen{box-shadow:inset 0 0 0 1.5px currentColor}
.answer-option .choice-tick{font-size:14px;line-height:1}
.answer-readonly{font-size:12px;color:#637574;line-height:1.6;padding:2px 3px 5px}
@keyframes answerAppear{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.answer-choice-popover{width:252px;padding:11px}.answer-option{min-height:43px;font-size:11px}.compact-answer-trigger{min-height:34px}}
@media(prefers-reduced-motion:reduce){.answer-choice-popover{animation:none}.compact-answer-trigger,.answer-option{transition:none}}


.match.expanded{padding:20px 22px;border-color:#dce7e7}
.expanded-body{display:grid;grid-template-columns:minmax(215px, .8fr) minmax(430px,1.6fr);gap:19px;align-items:start}
.expanded-summary{width:100%;border:0;background:none;text-align:left;padding:0;color:inherit;cursor:pointer}
.expanded-summary:hover .names{text-decoration:underline;text-decoration-color:#9cc5ba}
.expanded-summary .bars{margin-top:15px}
.expanded-actions{border-left:1px solid #ebefef;padding-left:20px;min-width:0}
.quick-block{margin:0 0 12px}
.quick-caption{font-size:11px;color:#718282;font-weight:800;margin:0 0 7px}
.choice-group{display:flex;gap:6px;flex-wrap:wrap}
.choice-button{border:1px solid #dfe6e8;background:#f9fbfb;color:#667879;border-radius:10px;min-height:34px;min-width:66px;padding:5px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.choice-button:hover:not(:disabled){border-color:#95beba;background:#f0f8f5}
.choice-button:disabled{opacity:.46}
.choice-button.active{box-shadow:inset 0 0 0 1px currentColor}
.quick-persons{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.quick-person .quick-caption{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quick-person .choice-button{flex:1;min-width:0}
.quick-foot{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid #edf1f1;flex-wrap:wrap}
.quick-open{font-size:12px;color:#287b70;font-weight:800;border:0;background:none;padding:6px 0}
.quick-update{margin:15px 0 0;border-top:1px solid #e8eeee;padding-top:14px}
.quick-update label{display:block;color:#496e70;font-weight:800;font-size:12px;margin-bottom:7px}
.quick-update textarea{min-height:82px}
.quick-update .formfoot{margin-top:9px}
.quick-help{font-size:11px;color:#849193;font-weight:550}
.toast .undotoast{background:#ffffff21;border:1px solid #ffffff55;color:white;padding:4px 10px;border-radius:20px;margin-left:10px;font-weight:750;cursor:pointer}
.endchoices{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

@media(max-width:440px){.quick-persons{grid-template-columns:1fr}.quick-person .choice-button{min-height:38px;font-size:12px}.listhead{flex-wrap:wrap}}

<body><main id="app" class="wrap"></main><div id="modalroot"></div><div id="toastroot"></div>
<script>
(()=>{
'use strict';
const people={
 d:{first:'David',last:'Klein',age:32,city:'Jerusalem',job:'Teacher',gender:'guy'},n:{first:'Noa',last:'Weiss',age:29,city:'Beit Shemesh',job:'Graphic designer',gender:'girl'},
 m:{first:'Moshe',last:'Green',age:35,city:'Safed',job:'Accountant',gender:'guy'},t:{first:'Tamar',last:'Gold',age:31,city:'Jerusalem',job:'Social worker',gender:'girl'},
 a:{first:'Ari',last:'Stern',age:34,city:'Jerusalem',job:'Engineer',gender:'guy'},r:{first:'Rina',last:'Cohen',age:30,city:'Haifa',job:'Teacher',gender:'girl'},
 y:{first:'Yosef',last:'Levy',age:36,city:'Safed',job:'BIM modeler',gender:'guy'},c:{first:'Chaya',last:'Rubin',age:33,city:'Jerusalem',job:'Occupational therapist',gender:'girl'},
 s:{first:'Shmuel',last:'Feld',age:38,city:'Bnei Brak',job:'Bookkeeper',gender:'guy'},e:{first:'Esther',last:'Baruch',age:35,city:'Jerusalem',job:'Teacher',gender:'girl'},
 q:{first:'Yossi',last:'Rosen',age:33,city:'Jerusalem',job:'Designer',gender:'guy'},l:{first:'Leah',last:'Shapiro',age:31,city:'Safed',job:'Nurse',gender:'girl'},
 h:{first:'Daniel',last:'Adler',age:32,city:'Jerusalem',job:'Developer',gender:'guy'},v:{first:'Leah',last:'Rosen',age:29,city:'Jerusalem',job:'Occupational therapist',gender:'girl'}
};
const shadchanim={mc:{name:'Miriam Cohen',city:'Jerusalem'},rk:{name:'Rivka Kaplan',city:'Safed'},sh:{name:'Sara Hirsch',city:'Beit Shemesh'}};
const event=(id,text,at,source='')=>({id,text,at,source});
const attempt=(id,boyAnswer,girlAnswer,refs,dates,endedBy=null,endedReason='',events=[])=>({id,boyAnswer,girlAnswer,refs,dates,endedBy,endedReason,events});
const date=(id,when,where,status,feedback='')=>({id,when,where,status,feedback});
const templates=[
{id:'match1',boy:'d',girl:'n',shadchan:'mc',updated:8,tries:[attempt('try1','Yes','Thinking',true,[],null,'',[event('a1','Noa is thinking it over.','2026-10-12T17:20:00'),event('a2','References checked.','2026-10-11T11:25:00'),event('a3','David said Yes.','2026-10-10T14:20:00')])]},
{id:'match2',boy:'m',girl:'t',shadchan:'rk',updated:7,tries:[attempt('try1','Yes','',false,[],null,'',[event('b1','Offer recorded. Waiting for Tamar’s answer.','2026-10-11T12:30:00')])]},
{id:'match3',boy:'a',girl:'r',shadchan:'mc',updated:12,tries:[attempt('try1','Yes','Yes',true,[date('dt1','2026-10-07T19:00','Jerusalem','Happened','Both would like to meet again.'),date('dt2','2026-10-17T19:00','Hotel lobby, Jerusalem','Arranged')],null,'',[event('c1','Date 2 arranged for Oct 17.','2026-10-12T16:20:00'),event('c2','Date 1 happened.','2026-10-07T22:10:00'),event('c3','Rina said Yes.','2026-10-06T18:10:00'),event('c4','Ari said Yes.','2026-10-06T09:20:00'),event('c5','References checked.','2026-10-05T13:25:00')])]},
{id:'match4',boy:'y',girl:'c',shadchan:'sh',updated:11,tries:[attempt('try1','Yes','Yes',false,[date('dt1','2026-09-20T18:30','Safed','Happened'),date('dt2','2026-09-28T19:00','Jerusalem','Happened'),date('dt3','2026-10-05T19:30','Jerusalem','Happened'),date('dt4','2026-10-19T19:00','Jerusalem','Arranged')],null,'',[event('d1','Date 4 arranged for Oct 19.','2026-10-12T13:05:00'),event('d2','Date 3 happened.','2026-10-05T22:00:00'),event('d3','Date 2 happened.','2026-09-28T22:15:00'),event('d4','Date 1 happened.','2026-09-20T21:20:00'),event('d5','Both sides said Yes.','2026-09-18T13:50:00')])]},
{id:'match5',boy:'s',girl:'e',shadchan:'rk',updated:4,tries:[attempt('try1','Yes','No',true,[date('dt1','2026-08-10T19:00','Bnei Brak','Happened'),date('dt2','2026-08-18T19:00','Jerusalem','Happened')],'girl','Timing was not right.',[event('e1','Esther said No. The shidduch ended.','2026-08-20T10:35:00'),event('e2','Date 2 happened.','2026-08-18T22:00:00'),event('e3','Date 1 happened.','2026-08-10T21:50:00')])]},
{id:'match6',boy:'q',girl:'l',shadchan:'mc',updated:3,tries:[attempt('try1','Yes','No',true,[date('dt1','2026-06-04T19:00','Jerusalem','Happened')],'girl','They were not a good match.',[event('f1','Leah said No. The shidduch ended.','2026-06-06T12:40:00'),event('f2','Date 1 happened.','2026-06-04T22:05:00')])]},
{id:'match7',boy:'h',girl:'v',shadchan:'sh',updated:10,tries:[attempt('try1','Yes','No',true,[date('dt1','2026-04-01T19:00','Jerusalem','Happened'),date('dt2','2026-04-09T19:30','Jerusalem','Happened')],'girl','Not a good time to continue.',[event('g1','Leah said No. The shidduch ended.','2026-04-12T10:00:00'),event('g2','Date 2 happened.','2026-04-09T22:00:00')]),attempt('try2','Yes','Yes',false,[date('dt1','2026-10-21T19:00','Jerusalem','Arranged')],null,'',[event('g4','Date 1 arranged.','2026-10-12T10:00:00'),event('g3','The 2nd Try started.','2026-10-12T09:20:00')])]},
];
let compactMenu=null;
let matches=structuredClone(templates),listMode='compact',quickUpdateId=null,quickUndo=null,quickUndoTab=null,tab='progress',current=null,detailTab='overview',dateEdit=null,noteEditing=false,reporter=null,confirmEnd=null,confirmTry=false,modal=null,modalFromList=false,toastTimer=null,unique=100;
const el=document.getElementById('app'), modalroot=document.getElementById('modalroot'), toastroot=document.getElementById('toastroot');
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const currentTry=m=>m.tries[m.tries.length-1];
const status=m=>{const t=currentTry(m);if(t.endedBy||t.phase==='ended')return 'ended';if(t.phase==='dating')return 'progress';return 'offers';};
const endName=(m,t)=>t.endedBy==='boy'?name(m.boy):t.endedBy==='girl'?name(m.girl):t.endedBy==='both'?'both sides':'not specified';
const answerClass=v=>v==='Yes'?'yes':v==='No'?'no':v==='Thinking'?'thinking':'waiting';
const answerLabel=v=>v||'Waiting';
const phaseLabel=m=>status(m)==='progress'?'Dating':status(m)==='ended'?'Ended':'Checking';
const phaseKey=m=>status(m)==='progress'?'dating':status(m)==='ended'?'ended':'checking';
function primePhase(data){for(const m of data){for(const t of m.tries){if(!t.phase)t.phase=t.endedBy?'ended':t.boyAnswer==='Yes'&&t.girlAnswer==='Yes'?'dating':'checking';}}}
primePhase(matches);
const name=id=>people[id].first+' '+people[id].last;
const tryName=i=>`${i+1}${(i+1)%10===1&&(i+1)%100!==11?'st':(i+1)%10===2&&(i+1)%100!==12?'nd':(i+1)%10===3&&(i+1)%100!==13?'rd':'th'} Try`;
const now=()=>new Date().toISOString();
const datesNice=x=>x?new Date(x).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
const dateTime=x=>x?new Date(x).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}):'';
const markEvent=(t,text,source='')=>{const e=event('ev'+unique++,text,now(),source);t.events.unshift(e);return e;};
const dated=t=>t.dates.slice().sort((a,b)=>Number(a.id.slice(2))-Number(b.id.slice(2)));
function stage(t){if(t.endedBy)return 'Ended';const happened=t.dates.filter(x=>x.status==='Happened');const arranged=t.dates.filter(x=>x.status==='Arranged');if(arranged.length) return `Date ${arranged[arranged.length-1].id.slice(2)}`;if(happened.length)return `Date ${happened[happened.length-1].id.slice(2)}`;if(t.refs)return 'References';return 'Offer';}
function bars(t,dim=false){const done=new Set([0]);if(t.refs)done.add(1);t.dates.forEach(d=>{const i=Number(d.id.slice(2));if(d.status==='Happened'&&i<=8)done.add(i+1)});let html='<div class="bars" aria-label="Progress: offer, references, dates 1 through 8, marriage">';for(let i=0;i<11;i++){const label=i===0?'Offer':i===1?'References':i===10?'Marriage':`Date ${i-1}`;let klass='';if(dim)klass=done.has(i)?'past':'empty-past';else if(done.has(i))klass=i<2?'a':i<6?'b':i<10?'c':'d';html+=`<span class="seg ${klass}" title="${label}: ${done.has(i)?'completed':'not completed'}"></span>`}return html+'</div>'}
function counts(){return {offers:matches.filter(m=>status(m)==='offers').length,progress:matches.filter(m=>status(m)==='progress').length,ended:matches.filter(m=>status(m)==='ended').length}}
function getmatch(){return matches.find(m=>m.id===current)}
function getSummary(t){const upcoming=t.dates.filter(d=>d.status==='Arranged').sort((a,b)=>a.when.localeCompare(b.when))[0];if(t.endedBy||t.phase==='ended')return {title:'Ended',next:''};if(upcoming)return {title:'Dating',next:`Next: Date ${upcoming.id.slice(2)} · ${datesNice(upcoming.when)}`};const done=t.dates.filter(d=>d.status==='Happened');if(done.length)return {title:'Dating',next:`Next: Date ${Math.max(...t.dates.map(d=>Number(d.id.slice(2))),0)+1}`};if(t.boyAnswer==='Yes'&&t.girlAnswer==='Yes')return {title:'Both said Yes',next:'Ready to arrange Date 1'};if(t.refs)return {title:'Checking references',next:'Waiting for both answers'};return {title:'Offer',next:'Waiting for answers'};}
function render(){const c=counts();el.innerHTML=`<div class="brandbar"><div class="brand"><span class="brand-icon">♥</span> ZivugMatch</div><div class="row"><span class="preview-tag">SHADCHAN MODE</span><span class="preview-tag">DESIGN DEMO</span></div></div>${current?viewDetail():viewList(c)}<div class="footer-demo"><span>Fictional sample data · Compact bubbles open rounded choices; Expanded offers quick controls. Changes reset on reload.</span><button class="reset" data-act="reset">Reset example data</button></div>`;renderModal()}
function viewList(c){const title=tab==='offers'?'Offers':tab==='progress'?'In Progress':'Ended';return `<header class="pagehead"><div><h1 class="page-title">Shidduchim</h1><p>Keep track of every shidduch, from first offer to what happens next.</p></div><button class="btn primary" data-act="make-match">Make Match</button></header><section class="surface"><nav class="tabbar" aria-label="Shidduchim stages">${[['offers','Offers'],['progress','In Progress'],['ended','Ended']].map(([k,v])=>`<button class="tab ${tab===k?'on':''}" data-list-tab="${k}">${v}<span class="num">${c[k]}</span></button>`).join('')}</nav><div class="listhead"><div><h2 style="margin-bottom:0">${title}</h2><p class="intro" style="margin:4px 0 0">${tab==='offers'?'Waiting for answers or checking references.':tab==='progress'?'Both sides have said Yes.':'Keep the history, even if a match ends.'}</p></div><div class="view-switch" role="group" aria-label="Shidduchim card size"><button class="${listMode==='compact'?'on':''}" data-list-mode="compact" aria-pressed="${listMode==='compact'}">Compact</button><button class="${listMode==='expanded'?'on':''}" data-list-mode="expanded" aria-pressed="${listMode==='expanded'}">Expanded</button></div></div><div class="matches">${sortedMatches().map(card).join('')||`<div class="blank"><h3>Nothing here yet</h3><p>Shidduchim will appear here as their status changes.</p></div>`}</div></section>`}
function sortedMatches(){const a=matches.filter(m=>status(m)===tab);return a.sort((x,y)=>y.updated-x.updated)}
function coloredAnswer(m,side){const t=currentTry(m),p=people[m[side]],v=t[side+'Answer'];
 const open=compactMenu?.id===m.id&&compactMenu?.side===side;
 const values=[['','Not answered yet'],['Yes','Yes'],['Thinking','Thinking'],['No','No']];
 const panel=open?`<div class="answer-choice-popover" role="group" aria-label="Choose ${esc(p.first)}'s answer"><div class="answer-choice-title">${status(m)==='ended'?`This try is already ended`: `Change ${esc(p.first)}'s answer`}</div>${status(m)==='ended'?`<div class="answer-readonly">Previous answers are kept in History. Open details to start another try.</div><button class="btn btn-light" type="button" data-open="${m.id}">Open details →</button>`:`<div class="answer-choice-grid">${values.map(([val,label])=>`<button type="button" class="answer-option ${answerClass(val)} ${v===val?'chosen':''}" data-pick-answer="${val||'waiting'}" data-match="${m.id}" data-side="${side}" aria-pressed="${v===val}">${v===val?'<span class="choice-tick" aria-hidden="true">✓</span>':''}${esc(label)}</button>`).join('')}</div>`}</div>`:'';
 return `<span class="answer-cell ${side}"><button type="button" class="quick-tag compact-answer-trigger ${answerClass(v)}" data-answer-trigger="${side}" data-match="${m.id}" aria-label="Change ${esc(p.first)}'s answer, currently ${esc(v||'Not answered yet')}" aria-expanded="${open}" aria-haspopup="true"><small>${esc(p.first)}:</small><strong>${esc(answerLabel(v))}</strong></button>${panel}</span>`;
}
function stageChoices(m){const st=phaseKey(m),ended=st==='ended';return `<div class="quick-block"><div class="quick-caption">Stage</div><div class="choice-group">${[['checking','Checking'],['dating','Dating'],['ended','Ended']].map(([k,v])=>`<button type="button" class="choice-button ${k} ${st===k?'active':''}" data-quick-stage="${k}" data-match="${m.id}" aria-pressed="${st===k}" ${ended?'disabled':''}>${v}</button>`).join('')}</div></div>`}
function answerChoices(m,side){const t=currentTry(m),p=people[m[side]],current=t[side+'Answer'];return `<div class="quick-person"><div class="quick-caption">${esc(p.first)}'s answer</div><div class="choice-group">${[['Yes','yes'],['No','no'],['Thinking','thinking']].map(([v,k])=>`<button type="button" class="choice-button ${k} ${current===v?'active':''}" data-quick-answer="${v}" data-match="${m.id}" data-side="${side}" aria-pressed="${current===v}" ${status(m)==='ended'?'disabled':''}>${v}</button>`).join('')}</div></div>`}
function card(m){const t=currentTry(m),st=status(m),stg=stage(t);
 // Compact: pending answers replace the entire old explanatory line.
 // When both say Yes, restore the original progress / next-date text.
 // Ended: show answers, followed by one simple "Ended" label; no "Ended by" repetition.
 const bothYes=t.boyAnswer==='Yes'&&t.girlAnswer==='Yes';
 const compactAnswers=listMode==='compact'&&(st==='ended'||!bothYes);
 const ans=st==='offers'?'Waiting for answers':getSummary(t).next;
 const originalStatus=`<div class="card-sub"><span class="stage ${stg.startsWith('Date')?'dating':''}">${esc(stg)}</span>${ans?`<span>·</span><span>${esc(ans)}</span>`:''}</div>`;
 const endedSummary=`<div class="card-sub"><span class="stage ended">Ended</span></div>`;
 const inlineStatus=`<div class="compact-answers-inline" aria-label="Current answers">${coloredAnswer(m,'boy')}${coloredAnswer(m,'girl')}${st==='ended'?'<span class="compact-ended">Ended</span>':''}</div>`;
 const statusContent=listMode==='compact'?(compactAnswers?inlineStatus:originalStatus):(st==='ended'?endedSummary:originalStatus);
 const summary=`<div class="card-top"><div class="heart ${st==='ended'?'ended':''}" aria-hidden="true">♥</div><div class="card-main"><div class="card-top"><div class="names">${esc(name(m.boy))} <span style="color:#9caaa9;font-weight:500">–</span> ${esc(name(m.girl))}</div><div class="card-end card-end-right"><span class="try">${m.tries.length>1?tryName(m.tries.length-1):''}</span></div></div>${statusContent}${bars(t,st==='ended')}${t.endedReason&&st==='ended'?`<div class="barhint">${esc(t.endedReason)}</div>`:''}</div></div>`;
 if(listMode==='compact')return `<article class="match compact ${compactMenu?.id===m.id?'menu-open':''}" aria-label="${esc(name(m.boy))} and ${esc(name(m.girl))}"><button type="button" class="compact-card-open" data-open="${m.id}" aria-label="Open details for ${esc(name(m.boy))} and ${esc(name(m.girl))}"></button>${summary}</article>`;
 return `<article class="match expanded" aria-label="Shidduch: ${esc(name(m.boy))} and ${esc(name(m.girl))}"><div class="expanded-body"><button type="button" class="expanded-summary" data-open="${m.id}" title="Open full shidduch details">${summary}</button><div class="expanded-actions">${stageChoices(m)}<div class="quick-persons">${answerChoices(m,'boy')}${answerChoices(m,'girl')}</div><div class="quick-foot"><button type="button" class="btn btn-light" data-add-update="${m.id}">Add update</button><button type="button" class="quick-open" data-open="${m.id}">Open details →</button></div></div></div>${quickUpdateId===m.id?`<form class="quick-update" data-update-form="${m.id}"><label for="update-${m.id}">What happened? <span class="quick-help">Saved with today's date and time</span></label><textarea class="field" id="update-${m.id}" required placeholder="Spoke to the shadchan, checked references, got an answer…"></textarea><div class="formfoot"><button type="button" class="btn" data-act="cancel-quick-update">Cancel</button><button class="btn primary" type="submit">Save update</button></div></form>`:''}</article>`;
}
function viewDetail(){const m=getmatch(), t=currentTry(m), st=status(m),summ=getSummary(t),idx=m.tries.length-1;return `<header class="detailhead"><div class="left"><button class="back" data-act="back">← Back to Shidduchim</button><div class="couple-line">${esc(people[m.boy].first)} &amp; ${esc(people[m.girl].first)}${idx>0?' · '+tryName(idx):''}</div></div><span class="statuslabel ${st==='ended'?'ended':''}">${st==='offers'?'Offer':st==='progress'?'In Progress':'Ended'}</span></header><section class="surface"><div class="detailbar">${bars(t,st==='ended')}<div class="legend"><span>Offer</span><span>References</span><span>Dates 1–8</span><span>Marriage</span></div>${m.tries.length>1?`<div class="pastbars">${m.tries.slice(0,-1).map((old,i)=>`<div class="pastname">${tryName(i)} · ended</div>${bars(old,true)}`).join('')}</div>`:''}</div><nav class="detailtabs" aria-label="Shidduch details">${[['overview','Overview'],['dates','Dates'],['history','History']].map(([k,v])=>`<button class="detailtab ${detailTab===k?'on':''}" data-detail-tab="${k}">${v}</button>`).join('')}</nav>${detailTab==='overview'?overview(m,t,st,summ):detailTab==='dates'?datesView(m,t):historyView(m,t)}</section>`}
function personCard(m,t,side){const id=m[side],p=people[id],val=t[side+'Answer'];return `<div class="person"><div class="personhead"><span class="avatar ${side==='girl'?'pink':''}">${esc(p.first.slice(0,1)+p.last.slice(0,1))}</span><button class="who" data-person="${id}" title="View person profile"><span>${esc(p.first)}</span><span>${esc(p.last)}</span></button></div><div class="persmeta">${p.age} · ${esc(p.city)}<br>${esc(p.job)}</div><div style="margin-top:15px"><label class="answerlabel" for="answer-${side}">Answer</label><select id="answer-${side}" class="answerselect ${val==='Yes'?'yes':val==='No'?'no':val==='Thinking'?'thinking':''}" data-answer="${side}" ${status(m)==='ended'?'disabled':''}><option value="" ${!val?'selected':''}>Not answered yet</option>${['Yes','Thinking','No'].map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select></div></div>`}
function overview(m,t,st,summ){const idx=m.tries.length-1;return `<div class="overview-title"><h2>${summ.title}</h2>${summ.next?`<p>${esc(summ.next)}</p>`:''}</div>${st==='ended'?`<div class="endpanel"><strong>Ended by ${esc(endName(m,t))}</strong>${t.endedReason?`<p>${esc(t.endedReason)}</p>`:''}</div>`:''}<div class="people">${personCard(m,t,'boy')}${personCard(m,t,'girl')}</div>${reporter?`<div class="note-form" style="margin-bottom:0"><div class="formlabel">Who told you? <span style="font-weight:400">(optional)</span></div><div class="inlinepair"><input id="reporter" class="field" style="flex:1;min-width:160px" placeholder="e.g. Miriam Cohen"><button class="btn btn-light" data-act="save-reporter">Save source</button><button class="btn" data-act="dismiss-reporter">Skip</button></div></div>`:''}<div class="underpeople"><span class="shadchan">Shadchan: <button data-shadchan="${m.shadchan}">${esc(shadchanim[m.shadchan].name)}</button></span></div>${st!=='ended'?`<div class="panel soft"><div class="minihead"><h3>References</h3><span class="pill">${t.refs?'Checked':'Not checked'}</span></div><div class="milestone-message">${t.refs?'References have been checked.':'Leave this unfinished if references were skipped—even when dates begin.'}</div>${!t.refs?`<button class="btn btn-light refbutton" data-act="refs">Mark references checked</button>`:''}</div>`:''}${st==='ended'?`<div class="panel"><div class="minihead"><div><h3>Another try?</h3><div class="milestone-message">Previous dates and history will be kept.</div></div><button class="btn primary" data-act="try">Try Again</button></div>${confirmTry?`<div class="note-form"><strong>Start a new try with this same couple?</strong><p class="formhint">The past try stays saved. New dates start from Date 1.</p><div class="inlinepair" style="margin-top:12px"><button class="btn primary" data-act="confirm-try">Start ${tryName(m.tries.length)}</button><button class="btn" data-act="cancel-try">Cancel</button></div></div>`:''}</div>`:''}<div class="history-head"><h3>Recent history</h3><button class="subtle" data-act="add-note">Add note</button></div>${t.events.length?`<div class="timeline">${t.events.slice(0,3).map(logView).join('')}</div>`:'<div class="emptyhistory">Nothing recorded yet.</div>'}<button class="notelink" data-act="full-history">See all history →</button>`}
function logView(e){return `<div class="log"><span class="dot"></span><div class="logbody"><div class="logtitle">${esc(e.text)}</div><div class="logmeta">${dateTime(e.at)}</div>${e.source?`<div class="logextra">Source: ${esc(e.source)}</div>`:''}</div></div>`}
function datesView(m,t){const upcoming=dated(t);return `<div class="section-title"><div><h2 style="margin-bottom:3px">Dates</h2><div class="quiet small">Arrange, update, and keep a record of each date.</div></div><button class="subtle no-wrap" data-act="arrange">Arrange a date</button></div>${dateEdit!==null?dateForm(t):''}<div class="dates">${upcoming.length?upcoming.map(d=>`<button class="dateitem" data-edit-date="${esc(d.id)}"><span class="calendar">${d.id.slice(2)}</span><span class="dateinfo"><strong>Date ${d.id.slice(2)} · ${d.status}</strong><small>${datesNice(d.when)}${d.where?' · '+esc(d.where):''}</small></span><span class="chev">›</span></button>`).join(''):`<div class="blank" style="border:0"><h3>No dates yet</h3><p>Use “Arrange a date” when both people are ready.</p></div>`}</div><div class="formhint">Dates only color the progress bar after they are marked Happened. Cancelled dates stay in the list.</div>`}
function dateForm(t){const isNew=dateEdit==='new';const d=isNew?{id:`dt${Math.max(0,...t.dates.map(d=>Number(d.id.slice(2))))+1}`,when:'',where:'',status:'Arranged',feedback:''}:t.dates.find(x=>x.id===dateEdit);return `<form id="dateform" class="formbox"><h3>${isNew?'Arrange a date':'Edit Date '+d.id.slice(2)}</h3><div class="form-grid"><div class="form-row"><div><label class="formlabel" for="date-when">When</label><input required class="field" id="date-when" type="datetime-local" value="${esc(d.when)}"></div><div><label class="formlabel" for="date-where">Where</label><input class="field" id="date-where" placeholder="Meeting place" value="${esc(d.where)}"></div></div><div><label class="formlabel" for="date-status">Status</label><select class="field" id="date-status">${['Arranged','Happened','Cancelled'].map(x=>`<option ${x===d.status?'selected':''}>${x}</option>`).join('')}</select></div><div><label class="formlabel" for="date-feedback">Feedback (private)</label><textarea class="field" id="date-feedback" placeholder="Optional notes about the date">${esc(d.feedback)}</textarea></div></div><div class="formfoot"><button class="btn" type="button" data-act="cancel-date">Cancel</button><button class="btn primary" type="submit">Save date</button></div></form>`}
function historyView(m,t){return `<div class="section-title"><h2 style="margin-bottom:0">History</h2><button class="subtle" data-act="add-note">Add note</button></div>${noteEditing?`<form class="note-form" id="noteform"><label class="formlabel" for="note">New note</label><textarea id="note" class="field" required placeholder="What happened?" autofocus></textarea><div class="formfoot"><button class="btn" type="button" data-act="cancel-note">Cancel</button><button class="btn primary" type="submit">Save note</button></div></form>`:''}<div class="timeline">${t.events.length?t.events.map(logView).join(''):'<div class="emptyhistory">No activity yet.</div>'}</div>${m.tries.length>1?`<div class="older"><h3>Previous tries</h3>${m.tries.slice(0,-1).map((old,i)=>`<details><summary>${tryName(i)} · ${old.endedBy?'Ended by '+esc(endName(m,old)):'Previous try'}${old.endedReason?' · '+esc(old.endedReason):''}</summary><div class="oldinner">${bars(old,true)}<div class="timeline" style="margin-top:12px">${old.events.map(logView).join('')}</div></div></details>`).join('')}</div>`:''}`}
function renderModal(){if(!modal){modalroot.innerHTML='';return}let content='';if(modal.kind==='make'){content=`<h2>Make Match</h2><p style="margin:12px 0 0">We haven't designed the Make Match screen yet. This button is included in the prototype so we can review its placement.</p>`}else if(modal.kind==='person'){const p=people[modal.id];content=`<h2>${esc(name(modal.id))}</h2><div style="margin-top:15px"><div class="persmeta">${p.age} · ${esc(p.city)} · ${esc(p.job)}</div><p style="margin-top:18px">Person profile preview only. The complete profile screen is not part of this Shidduchim prototype.</p></div>`}else if(modal.kind==='shadchan'){const s=shadchanim[modal.id];content=`<h2>${esc(s.name)}</h2><p style="margin-top:14px">${esc(s.city)} · Shadchan</p><p>Shadchan profile preview only.</p>`}else if(modal.kind==='stage-end'){const m=getmatch();content=`<h2>Move this shidduch to Ended?</h2><p style="margin-top:12px">${esc(name(m.boy))} and ${esc(name(m.girl))} · Answers, dates and history will be preserved.</p><form id="stage-end-form"><div class="formlabel">Who ended it? <span style="font-weight:400">(optional)</span></div><div class="endchoices">${[['unknown','Not specified'],['boy',people[m.boy].first],['girl',people[m.girl].first],['both','Both']].map(([v,label])=>`<label><input type="radio" name="ended-by" value="${v}" ${v==='unknown'?'checked':''}>${esc(label)}</label>`).join('')}</div><label class="formlabel" for="stage-end-reason">Reason (optional)</label><textarea class="field" id="stage-end-reason" placeholder="Only if known"></textarea><div class="formfoot"><button type="button" class="btn" data-act="close-modal">Cancel</button><button type="submit" class="btn btn-danger">Move to Ended</button></div></form>`
  }else if(modal.kind==='end'){const m=getmatch(),p=people[m[modal.side]];content=`<h2>End this shidduch?</h2><p style="margin-top:12px">${esc(p.first)} answered No. This will move the shidduch to Ended and keep all dates and history.</p><form id="endform"><label class="formlabel" for="end-reason">Reason (optional)</label><textarea class="field" id="end-reason" placeholder="Only if a reason is known"></textarea><label class="formlabel" style="margin-top:13px" for="end-source">Who told you? (optional)</label><input class="field" id="end-source" placeholder="e.g. Miriam Cohen"><div class="formfoot"><button class="btn" type="button" data-act="close-modal">Cancel</button><button class="btn btn-danger" type="submit">Move to Ended</button></div></form>`}modalroot.innerHTML=`<div class="overlay" data-overlay><div class="modal" role="dialog" aria-modal="true"><div class="modalhead" style="justify-content:flex-end"><button class="x" data-act="close-modal" aria-label="Close dialog">×</button></div>${content}</div></div>`;modalroot.querySelector('.x')?.focus()}
function showToast(text,undo=false){toastroot.innerHTML=`<div class="toast" role="status">${esc(text)}${undo?'<button class="undotoast" data-quick-undo>Undo</button>':''}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastroot.innerHTML='',2700)}
function selectedAnswer(side,value){const m=getmatch(),t=currentTry(m);if(t.endedBy)return;if(value==='No'){modal={kind:'end',side};renderModal();return}const key=side+'Answer';if(t[key]===value)return;t[key]=value;if(t.boyAnswer==='Yes'&&t.girlAnswer==='Yes'&&t.phase==='checking'){t.phase='dating';markEvent(t,'Both people said Yes; moved to In Progress.')}const who=people[m[side]].first;const e=markEvent(t,`${who}: ${value||'Answer cleared'}.`);reporter=e.id; m.updated=++unique;tab=status(m);render();showToast(`${who}'s answer updated`)}
function saveDate(){const m=getmatch(),t=currentTry(m),isNew=dateEdit==='new';const when=document.getElementById('date-when').value,where=document.getElementById('date-where').value.trim(),st=document.getElementById('date-status').value,feedback=document.getElementById('date-feedback').value.trim();if(!when){showToast('Choose a date and time');return}if(isNew){let n=Math.max(0,...t.dates.map(d=>Number(d.id.slice(2))))+1;t.dates.push(date('dt'+n,when,where,st,feedback));markEvent(t,`Date ${n} ${st.toLowerCase()}.`)}else{const d=t.dates.find(x=>x.id===dateEdit),n=d.id.slice(2),changed=d.status!==st||d.when!==when||d.where!==where;if(changed)markEvent(t,`Date ${n} ${st.toLowerCase()}${d.when!==when?', schedule updated':''}.`);Object.assign(d,{when,where,status:st,feedback})}if(t.boyAnswer==='Yes'&&t.girlAnswer==='Yes')t.phase='dating';dateEdit=null;m.updated=++unique;tab=status(m);render();showToast('Date saved')}
function saveNote(){const text=document.getElementById('note').value.trim();if(!text)return;const m=getmatch();markEvent(currentTry(m),text);noteEditing=false;m.updated=++unique;render();showToast('Note saved')}
function saveEnd(){const before=structuredClone(matches),m=getmatch(),t=currentTry(m),side=modal.side,reason=document.getElementById('end-reason').value.trim(),source=document.getElementById('end-source').value.trim();t[side+'Answer']='No';t.endedBy=side;t.phase='ended';t.endedReason=reason;markEvent(t,`${people[m[side]].first} said No. The shidduch ended.`,source);m.updated=++unique;modal=null;reporter=null;dateEdit=null;noteEditing=false;quickUndoTab=tab;tab='ended';quickUndo=before;if(modalFromList){current=null;modalFromList=false}render();showToast('Moved to Ended; history preserved',true)}
function saveStageEnd(){const m=getmatch(),t=currentTry(m),form=document.getElementById('stage-end-form');if(!form)return;const actor=new FormData(form).get('ended-by')||'unknown',reason=document.getElementById('stage-end-reason').value.trim();const old=structuredClone(matches);t.phase='ended';t.endedBy=actor;t.endedReason=reason;markEvent(t,`Shidduch moved to Ended${actor==='unknown'?'':' by '+endName(m,t)}.${reason?' Reason: '+reason:''}`);m.updated=++unique;quickUndoTab=tab;tab='ended';modal=null;quickUpdateId=null;quickUndo=old;if(modalFromList){current=null;modalFromList=false}render();showToast('Shidduch ended · history preserved',true)}
function quickStage(mid,value){const m=matches.find(x=>x.id===mid);if(!m)return;const t=currentTry(m),prev=status(m);if(prev==='ended'||phaseKey(m)===value)return;
 if(value==='ended'){modalFromList=true;current=mid;modal={kind:'stage-end'};renderModal();return;}
 if(value==='dating'&&!(t.boyAnswer==='Yes'&&t.girlAnswer==='Yes')){showToast('Dating requires Yes from both people. Update their answers first.');return}
 const before=structuredClone(matches);t.phase=value;markEvent(t,`Stage changed to ${value==='dating'?'Dating':'Checking'} (by you).`);m.updated=++unique;quickUndo=before;quickUndoTab=tab;tab=status(m);render();showToast('Stage updated',true);
}
function quickAnswer(mid,side,value){const m=matches.find(x=>x.id===mid);if(!m||status(m)==='ended')return;const t=currentTry(m),key=side+'Answer';if(t[key]===value)return;
 if(value==='No'){modalFromList=true;current=mid;modal={kind:'end',side};renderModal();return}
 const before=structuredClone(matches);const beforeStage=t.phase;t[key]=value;if(t.boyAnswer==='Yes'&&t.girlAnswer==='Yes'&&beforeStage==='checking'){t.phase='dating';markEvent(t,'Both people said Yes; moved to In Progress.')}
 markEvent(t,`${people[m[side]].first}'s answer: ${value||'Not answered yet'} (changed by you).`);m.updated=++unique;quickUndo=before;quickUndoTab=tab;tab=status(m);render();showToast(`${people[m[side]].first}'s answer → ${value||'Not answered yet'}`,true);
}
function submitQuickUpdate(mid){const m=matches.find(x=>x.id===mid),field=document.getElementById('update-'+mid);if(!m||!field||!field.value.trim())return;const before=structuredClone(matches);const text=field.value.trim();markEvent(currentTry(m),text);m.updated=++unique;quickUndo=before;quickUndoTab=tab;quickUpdateId=null;render();showToast('Dated update saved in History',true)}
function action(act){const m=getmatch();switch(act){case'reset':compactMenu=null;matches=structuredClone(templates);primePhase(matches);quickUpdateId=null;quickUndo=null;quickUndoTab=null;listMode='compact';tab='progress';current=null;detailTab='overview';dateEdit=null;modal=null;reporter=null;noteEditing=false;confirmTry=false;render();showToast('Demo reset');break;case'make-match':modal={kind:'make'};renderModal();break;case'close-modal':modal=null;if(modalFromList){current=null;modalFromList=false}render();break;case'back':current=null;dateEdit=null;reporter=null;noteEditing=false;confirmTry=false;render();break;case'arrange':dateEdit='new';render();setTimeout(()=>document.getElementById('dateform')?.scrollIntoView({behavior:'smooth',block:'center'}),0);break;case'cancel-date':dateEdit=null;render();break;case'add-note':detailTab='history';noteEditing=true;dateEdit=null;render();setTimeout(()=>document.getElementById('note')?.focus(),50);break;case'cancel-note':noteEditing=false;render();break;case'cancel-quick-update':quickUpdateId=null;render();break;case'full-history':detailTab='history';noteEditing=false;render();break;case'refs':{const t=currentTry(m);if(!t.refs){t.refs=true;markEvent(t,'References checked.');m.updated=++unique;render();showToast('References marked checked')}break}case'try':confirmTry=!confirmTry;render();break;case'cancel-try':confirmTry=false;render();break;case'confirm-try':{const t=attempt('try'+(m.tries.length+1),'','',false,[],null,'',[]);t.phase='checking';markEvent(t,`The ${tryName(m.tries.length)} started.`);m.tries.push(t);m.updated=++unique;tab='offers';confirmTry=false;detailTab='overview';render();showToast('New try started; past history saved');break}case'save-reporter':{const e=currentTry(m).events.find(x=>x.id===reporter);if(e)e.source=document.getElementById('reporter').value.trim();reporter=null;render();showToast('Source saved');break}case'dismiss-reporter':reporter=null;render();break}}
el.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.answerTrigger){const id=t.dataset.match,side=t.dataset.answerTrigger;compactMenu=(compactMenu?.id===id&&compactMenu?.side===side)?null:{id,side};render();if(compactMenu){const options=el.querySelector(`.menu-open .answer-choice-popover .answer-option.chosen`)||el.querySelector('.menu-open .answer-choice-popover .answer-option');options?.focus({preventScroll:true})}else{el.querySelector(`[data-answer-trigger="${side}"][data-match="${id}"]`)?.focus({preventScroll:true})}return}
 if(t.hasAttribute('data-pick-answer')){const id=t.dataset.match,side=t.dataset.side,value=t.dataset.pickAnswer==='waiting'?'':t.dataset.pickAnswer;compactMenu=null;quickAnswer(id,side,value);render();return}
 if(t.dataset.quickStage){quickStage(t.dataset.match,t.dataset.quickStage);return}if(t.dataset.quickAnswer){quickAnswer(t.dataset.match,t.dataset.side,t.dataset.quickAnswer);return}if(t.dataset.addUpdate){quickUpdateId=quickUpdateId===t.dataset.addUpdate?null:t.dataset.addUpdate;render();if(quickUpdateId)setTimeout(()=>document.getElementById('update-'+quickUpdateId)?.focus(),0);return}if(t.dataset.open){current=t.dataset.open;detailTab='overview';reporter=null;noteEditing=false;dateEdit=null;confirmTry=false;render();window.scrollTo({top:0,behavior:'instant'});return}if(t.dataset.listTab){compactMenu=null;tab=t.dataset.listTab;quickUpdateId=null;render();return}if(t.dataset.listMode){compactMenu=null;listMode=t.dataset.listMode;quickUpdateId=null;render();return}if(t.dataset.detailTab){detailTab=t.dataset.detailTab;dateEdit=null;noteEditing=false;reporter=null;render();return}if(t.dataset.editDate){detailTab='dates';dateEdit=t.dataset.editDate;render();setTimeout(()=>document.getElementById('dateform')?.scrollIntoView({behavior:'smooth',block:'center'}),0);return}if(t.dataset.person){modal={kind:'person',id:t.dataset.person};renderModal();return}if(t.dataset.shadchan){modal={kind:'shadchan',id:t.dataset.shadchan};renderModal();return}if(t.dataset.act)action(t.dataset.act)});
el.addEventListener('change',e=>{if(e.target.dataset.answer)selectedAnswer(e.target.dataset.answer,e.target.value)});
el.addEventListener('submit',e=>{if(e.target.dataset.updateForm){e.preventDefault();submitQuickUpdate(e.target.dataset.updateForm);return}if(e.target.id==='dateform'){e.preventDefault();saveDate()}else if(e.target.id==='noteform'){e.preventDefault();saveNote()}});
modalroot.addEventListener('click',e=>{if(e.target.matches('[data-overlay]')){modal=null;if(modalFromList){current=null;modalFromList=false}render();return}const b=e.target.closest('button');if(b&&b.dataset.act==='close-modal'){modal=null;if(modalFromList){current=null;modalFromList=false}render()}});
modalroot.addEventListener('submit',e=>{if(e.target.id==='endform'){e.preventDefault();saveEnd()}else if(e.target.id==='stage-end-form'){e.preventDefault();saveStageEnd()}});
toastroot.addEventListener('click',e=>{if(e.target.closest('[data-quick-undo]')&&quickUndo){matches=quickUndo;quickUndo=null;tab=quickUndoTab||tab;quickUndoTab=null;render();toastroot.innerHTML='';showToast('Last change undone')}});
 document.addEventListener('click',e=>{if(compactMenu&&!e.target.closest('.answer-cell')){compactMenu=null;render()}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&compactMenu){const {id,side}=compactMenu;compactMenu=null;render();el.querySelector(`[data-answer-trigger="${side}"][data-match="${id}"]`)?.focus();return}if(e.key==='Escape'&&modal){modal=null;if(modalFromList){current=null;modalFromList=false}render()}});
render();
})();
</script>
</body></html>
