const profileExists=()=>Boolean(s.source.trim()||s.files.length);
function parseRaw(){const raw=s.source; if(!raw.trim())return;let lines=raw.split(/\r?\n/);const fieldRules={name:/^(?:name|שם|имя)\s*[:：-]\s*(.+)/i,age:/^(?:age|גיל|возраст)\s*[:：-]\s*(\d{1,3})/i,city:/^(?:city|location|עיר|город)\s*[:：-]\s*(.+)/i,occupation:/^(?:occupation|profession|work|מקצוע|профессия)\s*[:：-]\s*(.+)/i,about:/^(?:about|about me|על עצמי|о себе)\s*[:：-]\s*(.+)/i,looking:/^(?:looking for|מחפש|מחפשת|ищет)\s*[:：-]\s*(.+)/i,maxAge:/^(?:up to age|maximum age|עד גיל)\s*[:：-]\s*(\d{1,3})/i};for(const [k,re] of Object.entries(fieldRules)){const m=lines.map(l=>l.trim().match(re)).find(Boolean);if(m&&!s[k])s[k]=m[1].trim()};const langs=lines.find(l=>/^(?:languages|שפות|языки)\s*[:：-]/i.test(l));if(langs&&!s.languages.length)s.languages=langs.replace(/^[^:：-]+[:：-]/,'').split(/,|\/|;/).map(a=>a.trim()).filter(Boolean);const sh=lines.find(l=>/^(?:shadchan|matchmaker|שדכן|שדכנית)\s*[:：-]/i.test(l));if(sh&&!s.shadchanName){const cleaned=sh.replace(/^[^:：-]+[:：-]\s*/,'').replace(/(?:\+?\d[\d\s().-]{6,}\d)/g,'').trim();s.shadchanName=cleaned}
const found=[];let currentCtx='';for(const line of lines){const text=line.trim();if(/^(?:shadchan|matchmaker)\s*:/i.test(text))currentCtx='shadchan';else if(/^(?:mother|father|reference|referral|parents|own phone|direct phone|phone|contact|shadchan phone)\s*:/i.test(text))currentCtx='';const candidates=[...line.matchAll(/(?:\+\d[\d\s().-]{7,}\d|\b0\d[\d\s().-]{6,}\d)/g)];for(const m of candidates){let nr=m[0].trim();if(nr.replace(/\D/g,'').length<8)continue;let before=line.slice(0,m.index).toLowerCase();let full=line.toLowerCase();let role='unknown',nm='';if(/(?:shadchan|matchmaker|שדכן|שדכנית)/i.test(before))role='shadchan';else if(/(?:own phone|direct phone|his phone|her phone|my phone|טלפון אישי)/i.test(before))role='person';else if(/\bmother\b|\bmom\b|אמא/i.test(before))role='mother';else if(/\bfather\b|\bdad\b|אבא/i.test(before))role='father';else if(/\breference\b|\bref\b|ממליץ/i.test(before))role='reference';else if(currentCtx==='shadchan'&&!/^(?:phone|contact)/i.test(before.trim()))role='shadchan';if(role==='shadchan')nm=s.shadchanName;else if(role==='person')nm=s.name;else if(role==='reference'||role==='mother'||role==='father')nm=before.replace(/^(?:mother|mom|father|dad|reference|ref|phone)\s*[:：-]?/i,'').replace(/[^\p{L}\s'-]/gu,'').trim();if(!found.some(p=>p.number.replace(/\D/g,'')===nr.replace(/\D/g,'')))found.push({id:idCount++,number:nr,role,name:nm,extractedRole:role});}}
if(found.length){const old=s.phones.filter(p=>p.number.trim());for(const p of found)if(!old.some(x=>x.number.replace(/\D/g,'')===p.number.replace(/\D/g,'')))old.push(p);s.phones=old;}if(!s.phones.length)s.phones=[{id:idCount++,number:'',role:'unknown',name:'',extractedRole:'unknown'}];}

function contactList(){const phoneContacts=s.phones.filter(p=>p.number.trim()||p.name.trim()||(p.email||'').trim());if(!phoneContacts.length)return `<p class="quiet tiny">No contacts yet. You can add a contact below.</p>`;return phoneContacts.map(p=>{const roles={person:'Their phone',shadchan:'Shadchan',unknown:'Unknown',mother:'Mother',father:'Father',reference:'Reference',other:'Other'};const shownName=p.name|| (p.role==='person'?s.name:'');return `<div class="contactcard"><div class="contactsummary"><span class="avatar">${p.role==='person'?icon.person:icon.users}</span><div class="contactidentity"><small>${roles[p.role]||'Unknown'}</small><strong>${h(shownName||(p.role==='unknown'?'Unidentified contact':'Name not provided'))}</strong><small class="tel">${h(p.number||'No phone recorded')}</small>${p.email?`<small class="email-summary">${h(p.email)}</small>`:''}</div><button class="editicon" data-edit-contact="${p.id}" aria-label="Edit contact" title="Edit contact">${icon.pencil}</button></div>${editContact===p.id?`<div class="contactedit"><div class="inputgroup"><label>Name</label><input data-contact="${p.id}" data-part="name" value="${h(shownName)}" placeholder="Name (optional)"></div><div class="inputgroup"><label>Phone number</label><input type="tel" data-contact="${p.id}" data-part="number" value="${h(p.number)}" placeholder="Phone"></div>${p.email||emailShown===p.id?`<div class="email-edit-row"><div class="inputgroup"><label>Email (optional)</label><input type="email" inputmode="email" autocomplete="off" data-contact="${p.id}" data-part="email" value="${h(p.email||'')}" placeholder="Email address"></div><button class="add-email" data-remove-email="${p.id}" title="Remove email field">Remove</button></div>`:`<button class="add-email" data-add-email="${p.id}">Add email…</button>`}<div class="inputgroup"><label>Who is this?</label><div class="chips">${Object.keys(roles).map(k=>`<button class="chip ${p.role===k?'on':''}" data-contact-role="${p.id}" data-value="${k <section class="sectionblock" id="sec-known"><div class="pillheading"><h3 class="sectiontitle" style="margin-bottom:12px">How well do I know them?</h3></div><div class="group" style="margin-top:0"><div class="flag-group">${visibleExtra('spoken').map(v=>`<button class="flag ${s.spoken.includes(v)?'on':''}" data-spoken="${h(v)}"><span class="circle">${s.spoken.includes(v)?icon.check:''}</span>${h(v)}</button>`).join('')}${[...visibleExtra('familiarStandard'),...visibleOptions('familiar')].map(v=>`<button class="flag ${s.familiar.includes(v)?'on':''}" data-familiar="${h(v)}"><span class="circle">${s.familiar.includes(v)?icon.check:''}</span>${h(v)}</button>`).join('')}</div><div class="addend">${dots('familiar')}</div>${editor('familiar','detail')}</div><div class="fieldrow three"><div>${area('How do you know them?','howKnow','Roommate, coworker, family friend...',2)}</div><div>${field('Years known','years','Years','type="number" min="0" step="0.5"')}</div></div></section>
${sectionVisible('family')?`<section class="sectionblock" id="sec-family"><h3 class="sectiontitle">Status</h3>${flagRows('family')}</section>`:''}
${sectionVisible('religious')?`<section class="sectionblock" id="sec-religious"><h3 class="sectiontitle">Religious</h3>${options('level','Religious Level')}${options('tzniut','Tzniut')}${options('background','Religious Background',true)}<div class="group">${flagRows('religious')}</div>${area('Other religious details','religiousNote','Other religious information...',2)}</section>`:''}
${sectionVisible('lifestyle')?`<section class="sectionblock" id="sec-lifestyle"><h3 class="sectiontitle">Character & Lifestyle</h3><div class="subgroup"><label>Traits</label><div class="chips">${visibleOptions('lifestyle').map(v=>`<button type="button" class="chip ${s.flags['lifestyle|'+v]?'on':''}" data-flag="lifestyle" data-value="${h(v)}">${h(v)}</button>`).join('')}${dots('lifestyle')}</div>${editor('lifestyle','trait')}</div>${options('body','Body Type')}</section>`:''}
${s.extraCategories.map(cat=>`<section class="sectionblock" id="sec-${h(cat.key)}"><h3 class="sectiontitle">${h(cat.name)}</h3>${flagRows(cat.key)}${!s.options[cat.key].length?'<p class="note">Add your first subcategory using the dots.</p>':''}</section>`).join('')}
<section class="sectionblock" id="sec-addcategory" style="border-bottom:0">${addCategory?`<div class="addbubble categoryinput"><label>New category</label><input id="new-category" placeholder="Category name (e.g. Education)"><div class="addcontrols">${action('Save','save-category',true)}${action('Cancel','cancel-category')}</div></div>`:`<div class="addcategory"><strong>New category</strong>${dots('new-category')}</div>`}</section>
<section class="sectionblock" id="sec-attachments"><h3 class="sectiontitle">Attached items</h3>${attachmentPicker(false)}${attachmentList(false)}</section>
<div class="buttonbar"><span></span>${action('Save and Finish','save-finish',true)}</div>${manageFooter()}</div>`;}
function donePage(){if(result==='sh-saved')return `<div class="done"><div class="doneicon">✓</div><h2>Shadchan saved</h2><p>${h(sh.name)} has been saved in this design demo.</p><div class="summarybox"><div><small>Phone</small>${h(sh.phone||'Not entered')}</div><div><small>Email</small>${h(sh.email||'Not entered')}</div><div><small>Files</small>${sh.files.length} attached</div></div>${action('Add another Shadchan','sh-another',true)} ${action('Return to editing','sh-return')}<p class="notefoot">Prototype only — nothing is permanently saved.</p></div>`;const isLater=result==='later';return `<div class="done"><div class="doneicon">✓</div><h2>${isLater?'Saved for later':'Person saved'}</h2><p>${isLater?'Kept in the demo To File inbox. No person record was created.':h(s.name||'This person')+' is saved in this demonstration.'}</p>${!isLater?`<div class="summarybox"><div><small>Name</small>${h(s.name||'Not entered')}</div><div><small>Age</small>${h(s.age||'Not entered')}</div><div><small>Numbers</small>${s.phones.filter(p=>p.number.trim()).length} saved</div><div><small>Original profile</small>${profileExists()?'Preserved for this browser session':'Not attached'}</div></div>`:''}${action('Add another person','fresh',true)} <button class="btn" data-action="return-edit" style="margin-left:8px">Return to editing</button><p class="notefoot">Prototype only — no account, cloud inbox, or permanent database.</p></div>`;}
function fitTextarea(t){if(!t||t.tagName!=='TEXTAREA')return;t.style.height='auto';t.style.height=Math.max(t.dataset.field==='source'?232:45,t.scrollHeight+2)+'px';}
function fitAllTextareas(){el.querySelectorAll('textarea').forEach(fitTextarea);}
async function pasteClipboard(){try{if(!navigator.clipboard?.readText)throw new Error('Clipboard unavailable');const text=await navigator.clipboard.readText();if(!text.trim()){notice='The clipboard is empty. You can type or press Ctrl+V in the box below.';render(true);return;}s.source=text;notice='Pasted from clipboard. Review it below or select Next.';render(true);}catch(e){notice='Your browser blocked clipboard access. Click the text box and press Ctrl+V instead.';render(true);el.querySelector('#f-source')?.focus();}}
function render(preserveScroll=false){const scroll=window.scrollY;el.innerHTML=`<header class="topbar"><div class="brand"><span class="brandmark">Z</span>ZivugMatch</div><div class="meta"><span class="demo">Clickable design · no server</span><button class="smalllink" data-action="demo-example">Load example</button><button class="smalllink" data-action="clear-all">Start fresh</button></div></header><div class="titleline"><div><h1>Add ${s.type}</h1><p>${s.type==='Shadchan'?'Keep the basics in one place. Everything else is optional.':'Start with what you have. Fill in the rest later.'}</p></div><div class="typepick"><button class="${s.type==='Guy'?'on':''}" data-type="Guy">Guy</button><button class="${s.type==='Girl'?'on':''}" data-type="Girl">Girl</button><button class="${s.type==='Shadchan'?'on':''}" data-type="Shadchan">Shadchan</button></div></div><main class="sheet">${result?donePage():s.type==='Shadchan'?`${notice?`<div class="toasts" role="status">${h(notice)}</div>`:''}${shadchanPage()}`:`<div class="tabs">${[['paste','Paste'],['basic','Basic Info'],['details','Detailed Info']].map(([k,t])=>`<button class="${s.tab===k?'on':''}" data-tab="${k}">${t}</button>`).join('')}</div>${notice?`<div class="toasts" role="status">${h(notice)}</div>`:''}${s.tab==='paste'?pastePage():s.tab==='basic'?basicPage():detailsPage()}`}</main><div class="footerinfo">ZivugMatch v3.0 design experiment · Fictional example data · Everything resets on refresh</div>`;fitAllTextareas();if(preserveScroll)window.scrollTo(0,scroll);}
function addPhone(){s.phones.push({id:idCount++,number:'',role:'unknown',name:'',extractedRole:'unknown'});}
function inputChange(target){fitTextarea(target);const shkey=target.dataset.shfield;if(shkey!==undefined){sh[shkey]=target.value;return;}const key=target.dataset.field;if(key!==undefined){s[key]=target.value;return;}const phone=target.dataset.phone;if(phone){const p=s.phones.find(p=>p.id==phone);if(p)p.number=target.value;return;}if(target.dataset.contact){const p=s.phones.find(p=>p.id==target.dataset.contact);if(p){p[target.dataset.part]=target.value;if(target.dataset.part==='name'&&p.role==='shadchan')s.shadchanName=target.value;if(target.dataset.part==='name'&&p.role==='person')s.name=target.value;}return;}}
function handleClick(t){
const shCh=t.dataset.shchoice;if(shCh){const v=t.dataset.value;const k=shCh==='shAges'?'ageGroups':'groups';sh[k]=sh[k].includes(v)?sh[k].filter(x=>x!==v):[...sh[k],v];render(true);return;}
const shLang=t.dataset.shlang;if(shLang){sh.languages=sh.languages.includes(shLang)?sh.languages.filter(x=>x!==shLang):[...sh.languages,shLang];render(true);return;}
const shSpoken=t.dataset.shspoken;if(shSpoken){if(shSpoken==='Never spoke')sh.spoken=sh.spoken.includes('Never spoke')?[]:['Never spoke'];else sh.spoken=sh.spoken.includes(shSpoken)?sh.spoken.filter(x=>x!==shSpoken):[...sh.spoken.filter(x=>x!=='Never spoke'),shSpoken];render(true);return;}
const shFam=t.dataset.shfamiliar;if(shFam){sh.familiar=sh.familiar.includes(shFam)?sh.familiar.filter(x=>x!==shFam):[...sh.familiar,shFam];render(true);return;}
const shFile=t.dataset.shFileRemove;if(shFile!==undefined){sh.files.splice(+shFile,1);render(true);return;}
if(t.hasAttribute('data-toggle-standard')){const key=t.dataset.toggleStandard,value=t.dataset.optionValue;const hidden=s.hiddenOptions[key]||[];s.hiddenOptions[key]=hidden.includes(value)?hidden.filter(v=>v!==value):[...hidden,value];render(true);return;}
if(t.hasAttribute('data-remove-option')){const k=t.dataset.removeOption, v=t.dataset.optionValue;if((s.options[k]||[]).includes(v)&&!(initialOptions[k]||[]).includes(v)){s.options[k]=s.options[k].filter(x=>x!==v);s.archivedOptions[k]=[...new Set([...(s.archivedOptions[k]||[]),v])];}render(true);return;}
if(t.hasAttribute('data-restore-option')){const k=t.dataset.restoreOption,v=t.dataset.optionValue;if(!(s.options[k]||[]).includes(v))s.options[k]=[...(s.options[k]||[]),v];s.archivedOptions[k]=(s.archivedOptions[k]||[]).filter(x=>x!==v);render(true);return;}
if(t.hasAttribute('data-manage-categories')){manageCategories=!manageCategories;pendingRemove=null;render(true);return;}
const toggled=t.dataset.toggleCategory;if(toggled){s.hiddenCategories=s.hiddenCategories||[];s.hiddenCategories=s.hiddenCategories.includes(toggled)?s.hiddenCategories.filter(x=>x!==toggled):[...s.hiddenCategories,toggled];render(true);return;}
const removeKey=t.dataset.removeCategory;if(removeKey){pendingRemove=removeKey;render(true);return;}
if(t.hasAttribute('data-cancel-remove')){pendingRemove=null;render(true);return;}
if(t.hasAttribute('data-confirm-remove')){const c=s.extraCategories.find(x=>x.key===pendingRemove);if(c){s.archivedCategories=s.archivedCategories||[];s.archivedCategories.push(c);s.extraCategories=s.extraCategories.filter(x=>x.key!==pendingRemove);}pendingRemove=null;render(true);return;}
const restoreKey=t.dataset.restoreCategory;if(restoreKey){const c=(s.archivedCategories||[]).find(x=>x.key===restoreKey);if(c){s.extraCategories.push(c);s.archivedCategories=s.archivedCategories.filter(x=>x.key!==restoreKey);}render(true);return;}
const emailAdd=t.dataset.addEmail;if(emailAdd!==undefined){emailShown=+emailAdd;render(true);return;}const emailRemove=t.dataset.removeEmail;if(emailRemove!==undefined){const p=s.phones.find(p=>p.id==emailRemove);if(p)p.email='';emailShown=null;render(true);return;}const jump=t.dataset.jump;if(jump){document.getElementById('sec-'+jump)?.scrollIntoView({behavior:'smooth',block:'start'});for(const b of el.querySelectorAll('[data-jump]'))b.classList.toggle('selected',b.dataset.jump===jump);return;}const fileId=t.dataset.fileRemove;if(fileId!==undefined){s.files.splice(+fileId,1);render(true);return;}const typ=t.dataset.type;if(typ){s.type=typ;result=null;manageCategories=false;editOption=null;notice='';render(true);return;}const tab=t.dataset.tab;if(tab){if(tab==='basic')parseRaw();s.tab=tab;notice='';render();return;}const pr=t.dataset.role;if(pr){const p=s.phones.find(p=>p.id==pr);if(p){p.role=t.dataset.value;if(p.role==='person')p.name=s.name;if(p.role==='shadchan')p.name=p.name||s.shadchanName;}render(true);return;}const lang=t.dataset.lang;if(lang){s.languages=s.languages.includes(lang)?s.languages.filter(v=>v!==lang):[...s.languages,lang];render(true);return;}const city=t.dataset.city;if(city){s.city=city;render(true);return;}const sender=t.dataset.sender;if(sender){s.sender=sender;render(true);return;}const spoken=t.dataset.spoken;if(spoken){if(spoken==='Never spoke')s.spoken=s.spoken.includes('Never spoke')?[]:['Never spoke'];else s.spoken=s.spoken.includes(spoken)?s.spoken.filter(v=>v!==spoken):[...s.spoken.filter(v=>v!=='Never spoke'),spoken];render(true);return;}const familiar=t.dataset.familiar;if(familiar){s.familiar=s.familiar.includes(familiar)?s.familiar.filter(v=>v!==familiar):[...s.familiar,familiar];render(true);return;}const f=t.dataset.flag;if(f){const value=t.dataset.value;const k=f+'|'+value;const wasSelected=!!s.flags[k];if(f==='family'&&!wasSelected){if(value==='Never been married')s.flags['family|Divorced']=false;else if(value==='Divorced')s.flags['family|Never been married']=false;}s.flags[k]=!wasSelected;render(true);return;}const pick=t.dataset.pick;if(pick){const value=t.dataset.value;if(t.dataset.multi==='true')s[pick]=s[pick].includes(value)?s[pick].filter(v=>v!==value):[...s[pick],value];else s[pick]=s[pick]===value?'':value;render(true);return;}const dots=t.dataset.dots;if(dots){if(dots==='new-category')addCategory=!addCategory;else editOption=editOption===dots?null:dots;render(true);return;}const eid=t.dataset.editContact;if(eid){editContact=editContact===+eid?null:+eid;emailShown=null;render(true);return;}const cr=t.dataset.contactRole;if(cr){const p=s.phones.find(p=>p.id==cr);if(p){p.role=t.dataset.value;if(p.role==='person'){p.name=s.name}if(p.role==='shadchan'){p.name=p.name||s.shadchanName}}render(true);return;}const action=t.dataset.action;if(!action)return;
switch(action){case'paste-clipboard':pasteClipboard();return;case'sh-save':if(!sh.name.trim()){notice='Enter the shadchan’s name before saving.';break;}result='sh-saved';notice='';break;case'sh-cancel':sh=makeShDefault();s.type='Guy';s.tab='paste';manageCategories=false;notice='Changes to the shadchan form were discarded.';break;case'sh-another':sh=makeShDefault();result=null;break;case'sh-return':result=null;break;case'demo-example':s=makeDefault();s.source=demoSource;notice='Example loaded. Click Next to see the extracted information.';result=null;break;case'clear-all':{const old=s;s=makeDefault();s.options=old.options;s.hiddenOptions=old.hiddenOptions;s.hiddenCategories=old.hiddenCategories;s.extraCategories=old.extraCategories;s.archivedCategories=old.archivedCategories;s.archivedOptions=old.archivedOptions;}result=null;editContact=null;editOption=null;notice='';break;case'go-basic':parseRaw();s.tab='basic';notice='';break;case'more-details':parseRaw();if(!s.name.trim()&&!s.phones.some(p=>p.role==='person'&&p.number.trim())){notice='Enter a name or their own phone number, or use Save for later.';break;}savedDemo.push({name:s.name});s.tab='details';notice='Basic Info saved in this demo. You can now add optional details.';break;case'save-later':if(!profileExists()&&!s.name.trim()){notice='Paste some information or attach a file first.';break;}inbox.push({source:s.source,name:s.name});result='later';break;case'save-finish':if(!s.name.trim()&&!s.phones.some(p=>p.role==='person'&&p.number.trim())){notice='Enter a name or their own phone number before saving, or use Save for later.';break;}if(!savedDemo.some(p=>p.name===s.name))savedDemo.push({name:s.name});result='saved';break;case'add-contact':addPhone();editContact=s.phones[s.phones.length-1].id;break;case'done-contact':editContact=null;break;case'remove-contact':s.phones=s.phones.filter(p=>p.id!==editContact);if(!s.phones.length)addPhone();editContact=null;break;case'save-option':{const val=$$('#new-option')?.value.trim()||'';if(val){const existing=(s.options[editOption]||[]).find(v=>v.toLocaleLowerCase()===val.toLocaleLowerCase());if(!existing)s.options[editOption]=[...(s.options[editOption]||[]),val];if(editOption==='languages'){const arr=s.type==='Shadchan'?sh.languages:s.languages;if(!arr.includes(existing||val))arr.push(existing||val);}}editOption=null;break;}case'cancel-option':editOption=null;break;case'save-category':{const nm=$$('#new-category')?.value.trim()||'';if(nm&&!s.extraCategories.some(c=>c.name.toLowerCase()===nm.toLowerCase())){const key='cat'+idCount++;s.extraCategories.push({name:nm,key});s.options[key]=[];}addCategory=false;break;}case'cancel-category':addCategory=false;break;case'view-original':overlay=true;showDrawer();return;case'fresh':{const opts=s.options;const categories=s.extraCategories;const archived=s.archivedCategories;const hidden=s.hiddenCategories;const archivedOptions=s.archivedOptions;const hiddenOptions=s.hiddenOptions;s=makeDefault();s.options=opts;s.extraCategories=categories;s.archivedCategories=archived;s.hiddenCategories=hidden;s.archivedOptions=archivedOptions;s.hiddenOptions=hiddenOptions;result=null;notice='';break;}case'return-edit':result=null;s.tab='details';break;default:return;}render(action==='save-option'||action==='save-category'||action==='cancel-option'||action==='cancel-category'||action==='add-contact'||action==='done-contact'||action==='remove-contact');}
function showDrawer(){if(!overlay)return;const div=document.createElement('div');div.className='overlay';div.id='originalOverlay';div.innerHTML=`<section class="drawer" role="dialog" aria-modal="true" aria-label="Original profile"><div class="drawerhead"><h2>Original Profile</h2><button class="btn" data-close-original>Close</button></div><div class="drawercontent" dir="auto">${h(s.source||'No pasted text. Original attached files are listed below.')}</div><div style="margin-top:18px">${s.files.map(f=>`<span class="filetag">${h(f.name)}</span>`).join('')}</div><p class="note">This is the unchanged profile. Your edits remain saved in the form when you close it.</p></section>`;document.body.appendChild(div);div.addEventListener('click',e=>{if(e.target===div||e.target.closest('[data-close-original]')){overlay=false;div.remove();}});div.querySelector('button')?.focus();}
el.addEventListener('input',e=>inputChange(e.target));el.addEventListener('click',e=>{const b=e.target.closest('button');if(b)handleClick(b)});el.addEventListener('change',e=>{if(e.target.id==='files'||e.target.id==='sh-files'){const target=e.target.id==='sh-files'?sh.files:s.files;const fs=[...e.target.files];for(const f of fs)target.push({name:f.name,size:f.size});render(true);}});window.addEventListener('keydown',e=>{if(e.key==='Escape'){const x=$$('#originalOverlay');if(x)x.remove();overlay=false;}});render();
})();
</script>
</body></html>
