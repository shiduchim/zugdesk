/* Home experiment: same warm notebook style, four clearly separated areas. */
.home-columns{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(275px,.93fr);gap:23px;align-items:start}
.home-aside{display:grid;gap:19px;min-width:0}
.home-main{min-width:0}
.home-section{margin-top:24px}
.home-section .section-head{margin:6px 0 11px}
.home-section h2{font-size:19px}
.note-section-title{display:flex;align-items:center;gap:8px;font-weight:700;color:#47627d;margin:16px 0 10px;font-size:14px}
.home-aside .sidepanel{padding:21px 20px}
.home-aside .sidepanel .sidehead{margin-bottom:12px}
.home-history-entry{display:flex;align-items:start;gap:9px;border-top:1px solid #edeef1;padding:11px 0}
.home-history-entry>span{width:50px;flex:none;color:#8592a2;font-size:11px}
.home-history-entry strong{font-size:12px;display:block;color:#334c69}
.home-history-entry p{color:#788799;font-size:11px;margin:3px 0 0;line-height:1.45}
.home-history-entry .tiny{min-width:23px;padding:3px;color:#6687b0}
.intro-history{margin:0 0 7px}
.notegrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.editor-top-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pin-toggle{display:inline-flex;align-items:center;gap:6px;border-radius:10px;border:1px solid #dee5ed;background:#fff;color:#61738a;font-size:12px;font-weight:650;min-height:35px;padding:6px 9px}
.pin-toggle.is-pinned{background:#e8effa;border-color:#cad9ee;color:#346098}
.suggest-header svg{width:12px;height:14px;flex:none;color:#6b84ab}
.suggest-zone{display:none}
.composer.writing .suggest-zone{display:block}
.composer .subtools{visibility:hidden;gap:7px}
.composer.writing .subtools{visibility:visible}
.composer .subtools .mini{background:white;border:1px solid #dae3ed;border-radius:10px;color:#58708b;min-height:34px;padding:6px 10px;font-size:12px}
.composer .subtools .active-follow{background:#e5f3eb;border-color:#a7dbc0;color:#356b51}
.composerfoot{flex-wrap:wrap}
.detail-top-row{display:flex;justify-content:space-between;align-items:start;gap:12px}
.detailtop .detail-top-row h1{overflow-wrap:anywhere}
.detailtimeline{padding-bottom:20px}
.inline-update{border-top:1px solid #e5ecf2;margin-top:7px;padding-top:18px}
.inline-update .composer{box-shadow:none}
.inline-update .smart-editor{min-height:96px}
.note-choice{display:flex!important;width:100%;text-align:left}
.action-menu{display:grid;gap:7px}
.action-menu .choice-row{text-align:left}
@media(max-width:930px){.home-columns{grid-template-columns:minmax(0,1fr) minmax(245px,.75fr);gap:14px}.home-aside .sidepanel{padding:15px}.notegrid{grid-template-columns:1fr}}
@media(max-width:740px){.home-columns{grid-template-columns:1fr}.home-aside{margin-top:4px}.notegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.comptop{gap:6px}}
@media(max-width:440px){.notegrid{grid-template-columns:1fr}.comptop{flex-wrap:wrap}.editor-top-actions{width:100%;justify-content:space-between}.composerfoot{gap:10px}.composer .subtools{gap:5px}.composer .subtools .mini{padding:7px 9px}.home-aside .sidepanel{padding:16px}.detail-top-row{flex-wrap:wrap}}

/* Version 2: a quiet single-column Home, with full-width notes aligned to capture. */
.home-columns{display:flex;flex-direction:column;gap:0;align-items:stretch}
.home-main,.home-aside{width:100%;max-width:100%;min-width:0}
.home-aside{display:flex;flex-direction:column;gap:24px;margin-top:25px}
.home-aside .sidepanel{margin:0;padding:21px 22px}
.home-section{margin-top:26px}
.notegrid{grid-template-columns:minmax(0,1fr)!important;gap:9px}
.note-card{min-height:0;padding:15px 19px 13px}
.note-card h3{margin-bottom:5px;padding-right:54px}
.note-card .preview{-webkit-line-clamp:2;max-height:44px}
.note-card .meta{margin-top:10px}
.note-section-title{margin-top:17px}
/* Text-only pin control at the note's upper corner, never an icon or pill. */
.pin-toggle,.note-card .cornerpin{background:transparent!important;border:none!important;border-radius:4px;box-shadow:none!important;color:#647b9a;font-size:12px;font-weight:700;padding:5px 2px;min-height:30px;min-width:36px;width:auto;height:auto}
.pin-toggle.is-pinned,.note-card .cornerpin.on{background:transparent!important;color:#315fa4}
.pin-toggle:hover,.note-card .cornerpin:hover{background:transparent!important;text-decoration:underline;text-underline-offset:3px}
.note-card .cornerpin{position:absolute;right:16px;top:13px;text-align:right}
/* Single dot for optional suggestions, generously sized invisible tap area. */
.suggest-dot{position:relative;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;min-height:30px;min-width:30px;padding:0;border:0;background:transparent!important;border-radius:50%;flex-shrink:0}
.suggest-dot-core{display:block;width:9px;height:9px;border-radius:50%;background:#afb7c2;box-shadow:0 0 0 1px #9ba5b2aa;transition:background .16s,box-shadow .16s}
.suggest-dot[aria-pressed="true"] .suggest-dot-core{background:#6b84ab;box-shadow:0 0 0 1px #6b84ab44}
.suggest-dot:hover .suggest-dot-core,.suggest-dot:focus-visible .suggest-dot-core{box-shadow:0 0 0 4px #dde8f5}
.suggest-dot::after{position:absolute;right:0;top:calc(100% + 5px);z-index:45;content:attr(data-hint);display:none;min-width:max-content;padding:7px 10px;border-radius:8px;color:#fff;background:#344a66;box-shadow:0 4px 12px #16283b24;font-size:11px;font-weight:500;white-space:nowrap;pointer-events:none}
.suggest-dot:hover::after,.suggest-dot:focus-visible::after{display:block}
/* Follow Ups distinct from History: light blue wash, blue action labels, no extra cards. */
.followups-panel{background:#f8fbff;border-color:#d9e6f4}
.followups-panel .sidehead h2{color:#385f90}
.followups-panel .taskrow{border-bottom-color:#e0eaf5}
.followups-panel .taskrow .taskname{color:#356ba5;font-weight:700}

document.addEventListener('input',ev=>{if(ev.target.id==='quickContactSearch'){const q=norm(ev.target.value);for(const b of $$('#quickContacts [data-personname]'))b.hidden=!norm(b.dataset.personname).includes(q);return}if(ev.target.id==='globalSearch'){U.query=ev.target.value;const pos=ev.target.selectionStart;render();$('#globalSearch').focus();$('#globalSearch').setSelectionRange(pos,pos);return}if(ev.target.id==='entryText'){let key=U.page==='detail'?'note:'+U.note:'new';draft(key).text=ev.target.value;persist();syncMirror();ev.target.closest('.composer')?.classList.toggle('writing',!!ev.target.value.trim())}if(ev.target.classList?.contains('inline-entry-text')){draft(ev.target.dataset.key).text=ev.target.value;persist();syncInlineHints()}if(ev.target.id==='entryTitle'){draft('new').title=ev.target.value;persist()}});
document.addEventListener('scroll',ev=>{if(ev.target.id==='entryText'){const mi=$('#mirror');if(mi){mi.scrollTop=ev.target.scrollTop;mi.scrollLeft=ev.target.scrollLeft}}},true);
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&currentQuickMenu){closeQuickMenu();return}if((ev.ctrlKey||ev.metaKey)&&ev.key==='Enter'&&ev.target.id==='entryText'){ev.preventDefault();saveEditor(U.page==='detail'?'note:'+U.note:'new')}if((ev.ctrlKey||ev.metaKey)&&ev.key==='Enter'&&ev.target.classList?.contains('inline-entry-text')){ev.preventDefault();saveEditor(ev.target.dataset.key)}if(ev.key==='Enter'&&ev.target.classList?.contains('note-card')){ev.preventDefault();if(U.page==='notes'&&!U.query){U.inlineNote=ev.target.dataset.id;render();$('#inlineEntryText')?.focus()}else navigate('detail',ev.target.dataset.id)}});
document.addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target;const data=new FormData(f);if(f.id==='personForm'){const n=String(data.get('name')||'').trim(),ex=S.people.find(p=>norm(p.name)===norm(n));if(!n)return;if(ex){closeModal();toast('This contact already exists.');return}const p={id:uid(),name:n,phone:data.get('phone'),role:data.get('role'),city:'',work:'',aliases:[],details:''};S.people.push(p);const key=f.dataset.key;if(key){draft(key).links.push(p.id)}stamp('Created contact: '+n);persist();closeModal();render();toast(n+' saved as a contact and linked.');return}
 if(f.id==='reminderForm'){S.items.unshift({id:uid(),title:String(data.get('title')).trim(),due:data.get('date'),type:'reminder',person:f.dataset.person||'',note:f.dataset.note||'',done:false,created:now()});stamp('Reminder created: '+data.get('title'));persist();closeModal();render();toast('Added to Follow Ups.');return}
 if(f.id==='itemEditForm'){const t=getI(f.dataset.id);t.title=String(data.get('title')).trim();t.due=data.get('due');stamp('Updated follow up: '+t.title);persist();closeModal();render();toast('Follow Up updated.');return}
 if(f.id==='linkForm'){getN(f.dataset.id).links=data.getAll('pid');stamp('Updated note contact links: '+getN(f.dataset.id).title);persist();closeModal();render();toast('People linked to note.');return}
 if(f.id==='renameForm'){getN(f.dataset.id).title=String(data.get('title')).trim();stamp('Renamed a note: '+getN(f.dataset.id).title);persist();closeModal();render();toast('Note title updated.');return}
 if(f.id==='editPersonForm'){const p=getP(f.dataset.id);for(const field of ['name','phone','city','work'])p[field]=String(data.get(field)||'').trim();stamp('Updated contact: '+p.name);persist();closeModal();render();toast('Person updated.');return}
 });
document.addEventListener('click',ev=>{const b=closestBtn(ev);if(!b){if(!ev.target.closest?.('#quickDropdown'))closeQuickMenu();return}const act=b.dataset.act,id=b.dataset.id,key=b.dataset.key;if(!['quick-toggle','quick-link'].includes(act))closeQuickMenu();switch(act){
 case 'quick-toggle':openQuickMenu(b.dataset.type,key,b);break;
 case 'quick-color':{const paletteColors=['plain','blue','yellow','peach','green','lilac'];const color=b.dataset.color;if(!paletteColors.includes(color))break;const targetKey=key||'new';const n=targetKey.startsWith('note:')?getN(targetKey.slice(5)):null;if(n){if(n.color!==color){n.color=color;stamp('Changed note color: '+n.title);persist();render();toast('Note color changed.')}}else{draft(targetKey).color=color;persist();render();toast('Color chosen for this note.');}break;}
 case 'quick-link':{const d=draft(key),pid=id,a=recognize(d.text),linked=d.links.includes(pid)||(!d.unlinked.includes(pid)&&a.known.includes(pid));if(linked){d.links=d.links.filter(x=>x!==pid);d.unlinked=[...new Set([...d.unlinked,pid])]}else{d.links=[...new Set([...d.links,pid])];d.unlinked=d.unlinked.filter(x=>x!==pid)}persist();b.querySelector('.tickmark').textContent=linked?'':'✓';const trigger=currentQuickMenu?.trigger;if(trigger)trigger.innerHTML=`Link Contact${d.links.length?' · '+d.links.length:''}`;syncMirror();syncInlineHints();break}

case 'nav':navigate(b.dataset.page);break;case 'toggle-history-entry':{U.expandedHistoryEntry=U.expandedHistoryEntry===id?'':id;render();const el=document.querySelector('.history-chevron[data-id="'+CSS.escape(id)+'"]');el?.focus({preventScroll:true});break;}case 'expand-history':U.expandedHistory=!U.expandedHistory;render();break;case 'expand-followups':U.expandedFollowups=!U.expandedFollowups;render();break;
case 'mobile-add-to-note':
case 'open-note':{
 // On a phone or other touch device, tapping the card's body does nothing.
 // Only the clearly labeled link starts a new dated update. Desktop keeps
 // the faster click-anywhere interaction.
 const touchLayout=window.matchMedia('(max-width:740px), (pointer:coarse)').matches;
 if(act==='open-note'&&b.classList.contains('note-card')&&touchLayout&&U.page==='notes'&&!U.query)break;
 if(U.page==='notes'&&!U.query){U.inlineNote=id;render();$('#inlineEntryText')?.focus()}
 else navigate('detail',id);
 break;
}
case 'collapse-note':U.inlineNote='';render();break;case 'open-person':navigate('person',id);break;case 'close-modal':closeModal();break;case 'clear-search':U.query='';render();break;
case 'toggle-suggestions':S.suggestions=!S.suggestions;persist();render();break;
case 'save-editor':saveEditor(key);break;
case 'draft-pin':{const d=draft(U.page==='detail'?'note:'+U.note:'new');d.pinned=!d.pinned;persist();const node=b;node.classList.toggle('is-pinned',d.pinned);node.setAttribute('aria-pressed',String(d.pinned));node.textContent=d.pinned?'Unpin':'Pin';break}
case 'draft-actions':draftActionsDialog(key);break;
case 'draft-links':draftLinksDialog(key);break;
case 'draft-followup':quickFollowup(key|| (U.page==='detail'?'note:'+U.note:'new'));break;
case 'choose-existing':chooseExistingDialog();break;
case 'append-existing':{const d=draft('new');if(!d.text.trim()){toast('Write the update first.');break}d.targetNoteId=id;persist();closeModal();saveEditor('new');break}
case 'detailed-followup':{const d=draft(key);const a=recognize(d.text);modal('Follow Up Details',`<form id="draftDetailedFollowupForm" data-key="${esc(key)}"><div class="field"><label>What needs to happen?</label><input name="title" required value="${esc(d.reminder?.title||d.text.split(/[.!?\n]/)[0].trim().slice(0,100)||'Follow up')}"></div><div class="field"><label>Date (optional)</label><input type="date" name="due" value="${esc(d.reminder?.due||a.reminder?.due||'')}"></div><div class="modalactions"><button type="button" class="outline" data-act="close-modal">Cancel</button><button class="primary">Add Follow Up</button></div></form>`);break}

case 'draft-link':{const d=draft(key);if(d.links.includes(id)){d.links=d.links.filter(x=>x!==id);d.unlinked=[...new Set([...d.unlinked,id])]}else{d.links=[...new Set([...d.links,id])];d.unlinked=d.unlinked.filter(x=>x!==id)}persist();syncMirror();break}
case 'draft-create':createPersonDialog(key,b.dataset.name);break;
case 'draft-reminder':quickFollowup(key);break;
case 'draft-waiting':{const d=draft(key);d.waiting=d.waiting?null:{title:'Waiting for reply: '+d.text.slice(0,75)};persist();syncMirror();break}
case 'draft-answer':{const d=draft(key),a=recognize(d.text);if(d.answer){d.answer=null;persist();syncMirror();break}if(a.status){modal('Review proposed update',`<p>When you save this note, update <b>Leah’s answer to ${esc(a.status.value)}</b>?</p><div class="inlinehint">${a.status.value==='No'?'This also moves the offer to Ended.':'Your own answer stays unchanged.'} The note remains saved in your notebook.</div><div class="modalactions"><button data-act="close-modal" class="outline">Cancel</button><button class="primary" data-act="queue-answer" data-key="${esc(key)}" data-value="${esc(a.status.value)}">Approve for Save</button></div>`) }break}
case 'queue-answer':{draft(key).answer={person:'leah',value:b.dataset.value};persist();closeModal();syncMirror();toast('Update ready. Save the note to apply it.');break}
case 'pin':{const n=getN(id);n.pinned=!n.pinned;stamp((n.pinned?'Pinned: ':'Unpinned: ')+n.title);persist();render();toast(n.pinned?'Note pinned.':'Note unpinned.');break}
case 'colors':colorsDialog(id);break;case 'choose-color':getN(id).color=b.dataset.color;stamp('Changed note color: '+getN(id).title);persist();closeModal();render();toast('Color updated.');break;
case 'link-note':linkDialog(id);break;case 'reminder-modal':reminderDialog(id,b.dataset.person||'');break;case 'rename':renameDialog(id);break;
case 'delete-note':modal('Delete this note?',`<p>This removes the note and its dated text from the notebook. Linked Active Items will keep their task text.</p><div class="modalactions"><button class="outline" data-act="close-modal">Cancel</button><button class="primary" data-act="confirm-delete" data-id="${id}">Delete note</button></div>`);break;
case 'confirm-delete':S.notes=S.notes.filter(n=>n.id!==id);stamp('Deleted a note');persist();closeModal();navigate('notes');toast('Note deleted.');break;
case 'task-done':{const t=getI(id);if(t.type==='approval')return openItem(id);t.done=!t.done;stamp((t.done?'Finished: ':'Reopened: ')+t.title);persist();render();toast(t.done?'Follow up completed.':'Item reopened.');break}
case 'open-item':openItem(id);break;
case 'new-person':createPersonDialog('', '');break;case 'edit-person':editPersonDialog(id);break;
case 'manual-answer':answerDialog(id,b.dataset.side,b.dataset.value);break;
case 'confirm-answer':{const o=S.offers.find(o=>o.id===id);changeAnswer(o,b.dataset.side,b.dataset.value);if(b.dataset.source){const t=getI(b.dataset.source);if(t)t.done=true}persist();closeModal();render();toast('Shidduch answer updated.');break}
}});
document.addEventListener('submit',ev=>{if(ev.target.id==='draftLinksForm'){ev.preventDefault();const d=draft(ev.target.dataset.key);d.links=[...new FormData(ev.target).getAll('pid')];d.unlinked=[];persist();closeModal();syncMirror();toast('Contacts selected for this note.');return}
if(ev.target.id==='draftDetailedFollowupForm'){ev.preventDefault();const d=draft(ev.target.dataset.key),f=new FormData(ev.target);d.reminder={title:String(f.get('title')).trim(),due:String(f.get('due')||'')};persist();closeModal();syncMirror();toast('Follow Up ready. Save the note.');return}
if(ev.target.id==='draftDateForm'){ev.preventDefault();const d=draft(ev.target.dataset.key);if(d.reminder)d.reminder.due=new FormData(ev.target).get('due');persist();closeModal();syncMirror();toast('Reminder date selected. Save the note to keep it.')}});
render();
</script></body></html>
